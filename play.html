<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF5FF"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFB21F'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='%231D2650'%3E$%3C/text%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Billion Bro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: phone-first game column. Sticky HUD, tab views, fixed nav with a raised Travel button. Cutscenes on a full-screen bright stage.
   Single bright look on purpose (light sky palette), so no dark variant. */
:root{
  color-scheme:light;
  --bg:#EEF5FF; --bg2:#FFF7EC; --surface:#FFFFFF; --surface2:#EDF2FB; --ink:#1D2650; --muted:#5E6A91; --line:#D9E2F2;
  --cash:#12B076; --cash-soft:#D6F5E8; --sun:#FFB21F; --sun-soft:#FFF1CF; --loss:#F0574A; --loss-soft:#FFE1DD;
  --sky:#3D7BFF; --sky-soft:#DEE8FF; --grape:#8D63F2; --grape-soft:#EEE6FF; --ocean:#BFE0FF; --land:#F6EFD9;
  --shadow:0 1px 0 rgba(29,38,80,.04),0 8px 22px rgba(29,38,80,.09);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --navh:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,#F7FAFF 55%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.app{max-width:760px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;background:var(--surface2);transition:transform .15s cubic-bezier(.3,1.6,.6,1)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--cash);color:#fff;box-shadow:0 4px 0 #0B8558}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #D18A06}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #2556C9}
.btn.danger{background:var(--loss);color:#fff;box-shadow:0 4px 0 #BF3A2F}
.btn.big{font-size:18px;padding:16px 26px;border-radius:18px}
.btn.wide{width:100%}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.up{color:var(--cash)} .down{color:var(--loss)} .flat{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.screen{animation:screenIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(0) translateY(20px)}}

/* figure animation */
.fig .head{animation:headbob 3.6s ease-in-out infinite;transform-box:view-box}
@keyframes headbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-1.6deg)}}
.fig .torsoG{animation:breathe 3.6s ease-in-out infinite;transform-box:view-box}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.fig .waving{animation:wave 1.1s ease-in-out infinite;transform-box:view-box}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
.eyes{animation:blink 4.8s infinite;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.talking .mouth{animation:talk .15s infinite alternate;transform-box:view-box}
@keyframes talk{to{transform:scaleY(.4)}}
.portrait{border-radius:50%;display:block;flex:none}

/* Title */
#scr-title{min-height:100vh;display:grid;place-items:center;padding-block:36px}
.title-box{text-align:center;display:grid;gap:18px;justify-items:center;max-width:100%}
.logo{font-family:var(--display);font-size:clamp(58px,15vw,112px);line-height:.9;position:relative;color:var(--ink)}
.logo .b{color:var(--cash);display:inline-block;animation:bob 3s ease-in-out infinite}
.logo .coin{position:absolute;width:.42em;height:.42em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#FFB21F 60%,#E69100);right:-.3em;top:-.15em;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2) translateY(-8px)}}
.tagline{font-size:19px;font-weight:700;color:var(--muted);max-width:30ch}
.lineup{display:flex;justify-content:center;align-items:flex-end;flex-wrap:nowrap;max-width:100%;overflow:hidden}
.lineup span{margin-left:-26px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.lineup span:first-child{margin-left:0}
.lineup svg{display:block;max-width:none}
.stage-note{font-size:13px;color:var(--muted);background:var(--surface);padding:8px 14px;border-radius:999px;max-width:100%}

/* Creator */
#scr-create{padding-block:20px 60px}
.create-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.preview{text-align:center;display:grid;gap:6px;justify-items:center;background:linear-gradient(180deg,#DCEBFF,#FFFFFF)}
.preview h2{font-size:28px}
.story{font-size:14px;color:var(--muted);margin:0}
.opt h3{font-size:20px;margin-bottom:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.sw.on{border-color:var(--ink);transform:scale(1.08)}
.chip{padding:9px 14px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.acct{margin-top:14px;font-size:14px;color:var(--muted)}.linkbtn{font:inherit;font-weight:800;color:var(--sky,#3D7BFF);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.name-in{width:100%;font:inherit;font-size:18px;font-weight:800;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tcard{text-align:left;padding:14px;border-radius:16px;background:var(--surface2);border:3px solid transparent;display:grid;gap:4px}
.tcard.on{border-color:var(--cash);background:var(--cash-soft)}
.tcard b{font-size:16px}
.tcard .perk{font-size:13px;color:#0B8558;font-weight:700}
.tcard .flaw{font-size:13px;color:var(--loss);font-weight:700}
.tcard .d{font-size:13px;color:var(--muted)}
.sticky-go{position:sticky;bottom:12px;margin-top:6px}

/* Game HUD */
#scr-game{padding-bottom:calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px}
.hud .who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hud .who b{display:block;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .who small{font-size:12px;color:var(--muted);font-weight:800}
.cashbox{text-align:right}
.cashbox .v{font-family:var(--display);font-size:28px;line-height:1;color:var(--cash)}
.cashbox small{display:block;font-size:12px;font-weight:800;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow)}
.pill svg{width:13px;height:13px}
.pill.warn{background:var(--loss-soft);color:var(--loss)}
.track{height:8px;border-radius:99px;background:#DDE6F6;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cash),#7BD96A,var(--sun));transition:width .8s cubic-bezier(.2,1,.3,1)}
.tierline{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-top:3px}
.view{display:grid;gap:14px;animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title h3{font-size:22px}
.flag{font-size:10px;font-weight:900;padding:3px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);letter-spacing:.06em;vertical-align:middle;font-family:var(--body)}
.flag.CA{background:#FFE3E0;color:#C8352B}.flag.US{background:#DEE8FF;color:#2556C9}

.loc{display:grid;gap:8px;background:linear-gradient(135deg,#DDEBFF,#FFF0D6)}
.loc h2{font-size:28px}
.loc p{margin:0;font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.tag.cheap{background:var(--cash-soft);color:#0B8558}
.tag.pays{background:var(--sun-soft);color:#A86A00}
.tag.info{background:var(--sky-soft);color:#2556C9}
.shiftrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shiftrow span{flex:1;min-width:150px;font-size:13px;font-weight:700;color:var(--muted)}
.cargo{display:grid;gap:8px}
.capbar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.capbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),#7CA7FF);border-radius:99px;transition:width .5s}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{padding:8px 12px;font-size:13px}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:left;display:grid;gap:6px;align-content:start;transition:transform .15s cubic-bezier(.3,1.6,.6,1)}
.prod:active{transform:scale(.97)}
.prod .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.picon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.picon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend{font-weight:900;font-size:12px;padding:3px 7px;border-radius:99px;background:var(--surface2)}
.prod b.n{font-size:15px;line-height:1.15}
.prices{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.prices .bp{font-family:var(--display);font-size:22px;line-height:1}
.prices .sp{font-size:12px;font-weight:800;color:var(--muted)}
.own{font-size:12px;font-weight:800;padding:4px 8px;border-radius:9px;background:var(--surface2);justify-self:start}
.own.has{background:var(--sky-soft);color:#2556C9}
.prod.flash{animation:flash .5s}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--cash)}}

/* Map */
.mapcard{padding:10px;background:var(--ocean);overflow:hidden}
.mapsvg{width:100%;height:auto;display:block}
.mapsvg .land{fill:var(--land);stroke:#E3D6B0;stroke-width:1.2;stroke-linejoin:round}
.mapsvg .lake{fill:var(--ocean)}
.mapsvg .wwater{fill:#BFE0FF}
.mapsvg .city.locked{opacity:.4}
.worldsvg .reglab{cursor:pointer}
.worldsvg .reglab text{font-family:var(--display);font-size:15px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.mapchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.mapchips .chip{white-space:nowrap;flex:none}
.mapsvg .wave{fill:none;stroke:#fff;stroke-width:1.4;opacity:.55;stroke-linecap:round}
.mapsvg .route{fill:none;stroke:var(--sun);stroke-width:3;stroke-dasharray:6 6;stroke-linecap:round;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.mapsvg .city{cursor:pointer}
.mapsvg .city .dot{fill:#fff;stroke:var(--ink);stroke-width:2.2}
.mapsvg .city.here .dot{fill:var(--cash);stroke:#fff;stroke-width:2.5}
.mapsvg .city.sel .dot{fill:var(--sun);stroke:#fff;stroke-width:2.5}
.mapsvg .city text{font-family:var(--body);font-weight:900;font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.mapsvg .city text.hint{font-size:9px}
.mapsvg .ring{fill:none;stroke:var(--cash);stroke-width:2;animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.clist{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.crow b{font-size:16px}
.crow small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.crow .best{grid-column:1/-1}
.crow .fare{text-align:right;font-weight:900}
.crow .fare small{text-align:right}
.ride{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface2);text-align:left;width:100%}
.ride.own{background:var(--cash-soft)}
.ride.lock{opacity:.55}
.ride svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ride b{display:block}
.ride small{color:var(--muted);font-weight:700;font-size:12px}

/* Report */
button.rrow{width:100%;text-align:left;cursor:pointer;border:0;font:inherit;color:inherit}
button.rrow:active{transform:scale(.99)}
.tag.mini{font-size:10px;padding:2px 7px;margin-left:2px;vertical-align:middle;display:inline-block}
.dline{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.dl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:2px}
.crow .best{display:grid;gap:6px}
.crow.lockrow{opacity:.6}
.prod .own.nb{background:var(--sun-soft);color:#A86A00}
.dsum{display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface2);margin:4px 0 12px}
.view>*{min-width:0}
.pchips{max-width:100%;min-width:0;display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.pchips .chip{white-space:nowrap;flex:none}

.rep{display:grid;gap:6px;margin-top:6px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.rrow.carry{background:var(--sky-soft)}
.rrow .picon{width:32px;height:32px;border-radius:10px}
.rrow .picon svg{width:18px;height:18px}
.rrow b{display:block;font-size:14px;line-height:1.15}
.rrow small{color:var(--muted);font-weight:700;font-size:12px}
.rrow .pct{font-family:var(--display);font-size:18px;text-align:right}
.rrow .pct small{display:block;font-family:var(--body);font-size:11px;text-align:right}

/* Deals / bank */
.dgrid{display:grid;gap:10px}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lcard{display:flex;flex-direction:column;padding:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;text-align:left;width:100%;min-width:0}
.lcard .lifepic{display:block;width:100%;height:auto;aspect-ratio:200/130}
.lcard .lb{display:grid;gap:2px;padding:8px 10px 10px}
.lcard .lb b{font-size:14px;line-height:1.15}
.lcard .lp{font-weight:900;font-size:14px}
.lcard small{color:var(--muted);font-weight:700;font-size:11px}
.lcard.owned{box-shadow:0 0 0 3px var(--cash),var(--shadow)}
.lown{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.lown .lcard{flex:none;width:140px}
.lifebig .lifepic{display:block;width:100%;height:auto;aspect-ratio:200/130;border-radius:14px;margin-bottom:10px}
.deal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}
.deal .logo2{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff}
.deal b{display:block;font-size:15px;line-height:1.15}
.deal small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.deal .rt{text-align:right;font-weight:900}
.deal .rt small{text-align:right}
.badge2{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.deal.stock .rt{display:grid;justify-items:end;gap:2px}
.sparkw{display:block;width:64px}
.b-mine{background:var(--cash-soft);color:#0B8558}.b-rival{background:var(--loss-soft);color:var(--loss)}.b-free{background:var(--sun-soft);color:#A86A00}.b-risk{background:var(--grape-soft);color:var(--grape)}.b-info{background:var(--sky-soft);color:#2556C9}
.bank-hero{background:linear-gradient(135deg,#E2F6EC,#DDEBFF);display:grid;gap:10px}
.bank-hero .big{font-family:var(--display);font-size:40px;line-height:1;color:#0B8558}
.kv{display:grid;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Bet */
.stand{display:grid;gap:8px}
.st{display:grid;grid-template-columns:22px 42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.st.me{background:var(--cash-soft)}
.st .rk{font-weight:900;color:var(--muted);text-align:center}
.st .nm{font-weight:800;font-size:14px;min-width:0}
.st .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nm small{display:block;font-weight:700;color:var(--muted);font-size:11px}
.st .nw{font-weight:900;text-align:right;font-size:14px}
.st .nw small{display:block;font-size:11px;font-weight:800}
.ladder{display:grid;gap:6px}
.rung{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:14px}
.rung.done{background:var(--cash-soft);color:#0B8558}
.rung.now{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
.rung small{font-weight:700;color:var(--muted);font-size:12px;text-align:right}
.log{display:grid;gap:8px;font-size:13px}
.log div{display:grid;grid-template-columns:38px 1fr;gap:6px}
.log .w{color:var(--muted);font-weight:800}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);box-shadow:0 -6px 24px rgba(29,38,80,.1);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nwdelta{display:inline-block;margin-top:3px;font-size:12px;font-weight:900;padding:3px 9px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow)}
.nwdelta.down{color:var(--loss)}
.bzrow,.bztype,.bzup{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}

const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function nextF(s,n,wk,c,p){const h=x=>Math.max(1e-4,hash(s.seed+x+wk+c+p)),g=Math.sqrt(-2*Math.log(h('a')))*Math.cos(2*Math.PI*h('b'));return +clamp(n+(1-n)*.18+g*DIFF[s.diff].noise,.55,1.75).toFixed(4);}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function money(n){const neg=n<0;n=Math.abs(n);let s;if(n>=1e9)s=(n/1e9).toFixed(2)+'B';else if(n>=1e6)s=(n/1e6).toFixed(2)+'M';else s=Math.round(n).toLocaleString('en-US');return (neg?'-$':'$')+s;}
function pr(n){return n<100?'$'+n.toFixed(2):'$'+Math.round(n).toLocaleString('en-US');}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const heldOf=f=>{const k=Object.keys(S.inv).filter(p=>!f||f(p));return k.length?pick(k):null;};
const otherCity=()=>{const l=CITIES.filter(c=>c.id!==S.loc&&canReach(S.loc,c.id));return l.length?pick(l):null;};
const insured=()=>(S.insTo||0)>=S.week;
function hit(p,frac){const it=S.inv[p];if(!it)return {l:0,r:0,txt:''};const l=Math.max(1,Math.min(it.qty,Math.round(it.qty*frac*tr().bad)));const avg=it.avg;it.qty-=l;if(it.qty<=0)delete S.inv[p];
 let r=0;if(insured()){r=Math.round(l*avg*.9);S.cash+=r;}
 addLog(S,`Lost ${l} ${nm(p)}.${r?` Insurance paid ${money(r)}.`:''}`,'bad');return {l,r,txt:`${l} ${nm(p)}`,ins:r?` Your insurance pays you ${money(r)} for them.`:''};}
function sellNow(p,qty,unit,why){const it=S.inv[p];if(!it)return 0;qty=Math.min(qty,it.qty);if(qty<1)return 0;const g=qty*unit,pf=g-qty*it.avg;S.cash+=g;it.qty-=qty;if(!it.qty)delete S.inv[p];
 addLog(S,`Sold ${qty} ${nm(p)} ${why} for ${money(g)} (${pf>=0?'+':''}${money(pf)}).`,pf>=0?'good':'bad');popCash&&popCash(`+${money(g)}`,'var(--cash)');return g;}
const ok=(who,t,mood)=>({who,mood:mood||'happy',pages:[t]});
const fee=b=>Math.round(b*K());

function rollRoad(ctx){
 if(ctx.stay||S.trips<=1||Math.random()>.72)return null;
 const fresh=e=>!S.seen||!S.seen[e.id]||S.trips-S.seen[e.id]>=5;
 let pool=ROAD.filter(e=>(!e.cond||e.cond(ctx))&&fresh(e));if(!pool.length)pool=ROAD.filter(e=>!e.cond||e.cond(ctx));if(!pool.length)return null;
 for(let tries=0;tries<4&&pool.length;tries++){
  const tot=pool.reduce((a,e)=>a+(e.w||1),0);let x=Math.random()*tot,ev=pool[0];for(const e of pool){x-=(e.w||1);if(x<=0){ev=e;break;}}
  const res=ev.run(ctx);if(res){(S.seen=S.seen||{})[ev.id]=S.trips;res.who=res.who||'mo';res.mood=res.mood||'neutral';res.tag=res.tag||roadTag;return res;}
  pool=pool.filter(e=>e!==ev);}
 return null;
}

function startBiz(type,name){const t=BZT(type),cost=Math.round(t.cost*1.2);if(S.cash<cost)return toast(`You need ${money(cost)} in cash to start this.`);
 S.cash-=cost;const b={id:'b'+(S.bizSeq++),type,name:name||t.name,week0:S.week,units:1,opening:0,brand:20,lev:{price:1,mkt:1,staff:1,qual:1},own:1,pub:false,sent:1,auto:false,grow:false,
  hist:[],rev:0,cost:0,profit:0,trend:0,fx:[],mod:{rev:1,cost:1,sat:1,risk:1},ups:[],upPaid:0,goals:[],idea:null,ideaWeek:0,paid:cost};

function bizWeekOne(b,news){const t=BZT(b.type),L=b.lev;
 if(b.auto)autoLevers(b);
 if(b.opening){b.units+=b.opening;b.opening=0;}
 const sat=t.sat*b.mod.sat,crowd=1/(1+Math.max(0,b.units-1)/sat);
 b.trend=b.trend*.85+gauss()*.04;
 const demand=(.6+b.brand/100*.9)*crowd*(1+b.trend)*Math.exp(gauss()*t.risk*b.mod.risk);
 const pVol=[1.3,1,.72][L.price]*(L.price===2&&L.qual<2?.8:1),pMul=[.78,1,1.42][L.price];
 const mVol=[.92,1,1.06,1.12][L.mkt],sCap=[.86,1,1.06][L.staff];
 const base=bzRev(b)*b.units;
 const vol=Math.max(.05,demand*pVol*mVol*sCap*fxM(b,'vol'));
 const rev=base*vol*pMul*b.mod.rev*fxM(b,'rev');
 let cost=base*t.cr*(.45+.55*vol)*[.9,1,1.12][L.staff]*b.mod.cost*fxM(b,'cost')+base*[-.05,0,.08][L.qual]+base*[0,.04,.09,.16][L.mkt];
 if(b.auto)cost+=rev*.04;
 const profit=rev-cost;
 b.brand=clamp(b.brand+[-.6,.3,1,1.8][L.mkt]+[-.5,0,.6][L.qual]+(L.staff===0?-.2:L.staff===2?.2:0)-(L.price===0?.2:0)-(b.brand-50)*.01,0,100);
 if(b.pub)b.sent=clamp(b.sent*Math.exp(gauss()*.06+(profit>0?.004:-.01)),.5,2.2);
 b.fx.forEach(f=>f.w--);b.fx=b.fx.filter(f=>f.w>0);
 b.rev=rev;b.cost=cost;b.profit=profit;b.hist.push(profit);if(b.hist.length>40)b.hist.shift();
 if(b.auto&&b.grow&&b.hist.length>=4&&b.hist.slice(-4).every(x=>x>0)&&S.cash>nextUnitCost(b)*3&&b.units+b.opening<300&&Math.random()<.35){const c=nextUnitCost(b);S.cash-=c;b.opening++;b.paid+=c;news&&news.bz.push(`${b.name}'s manager opened another ${BZT(b.type).unit} (${money(c)}).`);}
 checkGoals(b,news);
 return profit*b.own;}
function autoLevers(b){const h=b.hist.slice(-4),avg=h.length?h.reduce((a,x)=>a+x,0)/h.length:0,margin=b.rev?avg/b.rev:0;
 b.lev.staff=1;b.lev.qual=b.brand>55?2:1;b.lev.price=b.lev.qual===2&&b.brand>65?2:1;b.lev.mkt=b.brand<45?2:margin<.08?1:b.brand<75?2:1;}

 const taken=FP().map(x=>x.name.split(' ')[0]).concat(out.map(x=>x.name.split(' ')[0]));const pool=(g==='f'?F_NAMES:M_NAMES).filter(n=>!taken.includes(n));
 out.push({id:'q'+(S.fam.seq++),g,type:t.id,name:pick(pool.length?pool:(g==='f'?F_NAMES:M_NAMES))+' '+pick(SURN),trait:pick(t.traits),look:g==='f'?womanLook():manLook()});}S.fam.pros=out;S.fam.prosTurn=S.trips;}

/* ===================== YEARS, AGE, HEALTH, INFLATION, BONDS ===================== */
const TPY=10; // turns per year
function ensureTime(s){if(s.age0==null){const old=(s.trips||0)>0;s.age0=old?34:22;s.t0=s.trips||0;}
 if(s.cpi==null)s.cpi=1;if(s.infl==null)s.infl=.025;if(s.hp==null)s.hp=85;s.bonds=s.bonds||[];s.hcare=s.hcare||{trainer:false,doctor:false};s.inflHist=s.inflHist||[];s.bondSeq=s.bondSeq||1;return s;}
const turnsIn=()=>Math.max(0,S.trips-S.t0);
const age=()=>S.age0+Math.floor(turnsIn()/TPY);
const turnOfYear=()=>turnsIn()%TPY+1;
const yearNo=()=>Math.floor(turnsIn()/TPY)+1;
const hpLabel=h=>h>=80?'Excellent':h>=60?'Good':h>=40?'Fair':h>=20?'Poor':'Critical';
const careCost=k=>Math.round(Math.max(k==='trainer'?300:800,W()*(k==='trainer'?.0004:.0008)));
/* ---- countries and bonds ---- */
const BOND_RISK={CA:0,US:0,CH:0,DE:0,GB:0,JP:0,AU:0,SG:0,FR:1,KR:1,AE:1,HK:1,ES:1,IT:1,CN:1,MA:2,MX:2,IN:2,CO:2,BR:2,ZA:2,TR:2,KE:2,NG:2,EG:2,AR:2,RU:2};
const RISK_LBL=['Very safe','Medium risk','High risk'];
const bondCountries=()=>[...new Set(CITIES.map(c=>c.c))].filter(c=>BOND_RISK[c]!=null);
const BOND_TERMS=[1,5,10,30];
function bondRate(cc,years){const r=BOND_RISK[cc];const base=[.025,.042,.075][r];const country=((cc.charCodeAt(0)*7+cc.charCodeAt(1)*3)%10)/1000;return base+country+Math.log(1+years)*.004+(S.infl-.025)*.6;}
const bondValue=b=>{const t=Math.min(b.years*TPY,turnsIn()-b.t);const g=Math.pow(1+b.rate,t/TPY);return b.amt*g*(b.linked?S.cpi/b.cpi0:1);};
const bondsTotal=()=>(S.bonds||[]).reduce((a,b)=>a+bondValue(b),0);
function buyBond(cc,years,linked,amt){amt=Math.floor(amt);if(amt<1||amt>S.cash)return toast('Not enough cash.');const rate=linked?Math.max(.005,bondRate(cc,years)-.015):bondRate(cc,years);
 S.cash-=amt;S.bonds.push({id:'bd'+(S.bondSeq++),cc,years,linked,rate,amt,t:turnsIn(),cpi0:S.cpi,age:age()});addLog(S,`Bought a ${years}-year ${CNAME(cc)} ${linked?'inflation-protected ':''}bond for ${money(amt)}.`,'');popCash(`-${money(amt)}`,'var(--loss)');toast(`Bond bought. Pays out in ${years} ${years===1?'year':'years'}.`);after();}
function sellBondEarly(id){const b=S.bonds.find(x=>x.id===id);if(!b)return;const v=Math.round(bondValue(b)*.9);S.cash+=v;S.bonds=S.bonds.filter(x=>x!==b);addLog(S,`Cashed out a ${CNAME(b.cc)} bond early for ${money(v)} (10% penalty).`,'bad');popCash(`+${money(v)}`,'var(--cash)');after();}
/* ---- per-turn and per-year ---- */
function timeTurn(scenes){
 // inflation creeps every turn
 S.cpi*=Math.pow(1+S.infl,1/TPY);
 // health
 let d=-.12;const load=S.biz.length+S.acq.length+myCos().length+Math.floor(reUnmanaged()/3);if(load>8)d-=.15;if(load>20)d-=.15;const a=age();if(a>45)d-=(a-45)*.012;
 if(S.hcare.trainer){d+=.35;payOut(careCost('trainer'));}if(S.hcare.doctor){d+=.25;payOut(careCost('doctor'));}
 if(S.debt>=BANKRUPT*.6)d-=.3;S.hp=clamp(S.hp+d,0,100);
 // bonds
 const due=S.bonds.filter(b=>turnsIn()-b.t>=b.years*TPY);due.forEach(b=>{const v=Math.round(bondValue(b));S.cash+=v;S.bonds=S.bonds.filter(x=>x!==b);addLog(S,`${CNAME(b.cc)} ${b.years}-year bond paid out ${money(v)} (+${money(v-b.amt)}).`,'good');
  scenes.push({who:'okonkwo',mood:'happy',tag:['t-good','Bond paid out'],pages:[`Your ${b.years}-year ${CNAME(b.cc)} ${b.linked?'inflation-protected ':''}bond just matured.`,`You put in ${money(b.amt)} and got back ${money(v)}. That's ${money(v-b.amt)} profit, now in your cash.`]});});
 // health warnings
 if(S.hp<35&&!S.hpWarn){S.hpWarn=true;scenes.push({who:'whitlock',mood:'worried',tag:['t-bad','Health'],pages:[`Your doctor called. Your health is ${hpLabel(S.hp).toLowerCase()} (${Math.round(S.hp)} out of 100).`,'Too much work and stress. A personal trainer, a doctor, a checkup or a vacation in the Life tab would help. Keep ignoring it and it will catch up with you.']});}
 if(S.hp>=45)S.hpWarn=false;
 if(S.hp<=8){S.hp=25;S.cash-=Math.min(S.cash,Math.round(Math.max(5000,W()*.01)));scenes.push({who:'whitlock',mood:'worried',tag:['t-bad','Hospital'],pages:['You collapsed and spent weeks in the hospital. You pulled through, barely.','The bills were huge. Next time you might not be so lucky. Take care of yourself.']});}
 // new year
 if(turnsIn()>0&&turnsIn()%TPY===0)scenes.push(newYearScene());}
function newYearScene(){const prev=S.infl;S.inflHist.push(+(prev*100).toFixed(1));if(S.inflHist.length>40)S.inflHist.shift();
 let r=S.infl*.6+.025*.4+gauss()*.01;if(Math.random()<.05)r+=rnd(.04,.07);S.infl=clamp(r,-.01,.14);
 // country crises can hurt risky bonds
 let crisis='';S.bonds.forEach(b=>{const rk=BOND_RISK[b.cc];const p=[0,.004,.02][rk];if(Math.random()<p&&!b.hit){b.hit=true;const cut=rnd(.4,.7);b.amt*=1-cut;crisis+=` ${CNAME(b.cc)} defaulted on its debt and your bond lost ${Math.round(cut*100)}% of its value.`;}});
 const nw=netWorth(),ch=S.yrNw!=null?nw-S.yrNw:null;S.yrNw=nw;
 const lines=[`Happy New Year! You're now ${age()}.`,`${ch!=null?`Your net worth ${ch>=0?'grew':'fell'} ${money(Math.abs(ch))} this year. `:''}Inflation was ${(prev*100).toFixed(1)}%, so prices went up about that much. ${S.infl>prev+.01?`Economists expect it to rise to around ${(S.infl*100).toFixed(1)}% next year.`:S.infl<prev-.01?`It should cool to about ${(S.infl*100).toFixed(1)}% next year.`:`Next year looks similar, around ${(S.infl*100).toFixed(1)}%.`}`,
  `Your health is ${hpLabel(S.hp).toLowerCase()} (${Math.round(S.hp)}/100).${crisis}`];
 return {who:'anchor',mood:crisis?'worried':'happy',tag:[crisis?'t-bad':'t-good',`Year ${yearNo()}`],onShow:confetti,pages:lines};}

function healthClick(d){switch(d.hl){

function ensureRE(s){s.re=s.re||{};const r=s.re;r.props=r.props||[];r.list=r.list||{};r.mkt=r.mkt||{};r.tr=r.tr||{};r.hist=r.hist||{};if(r.maxTier==null)r.maxTier=-1;r.seq=r.seq||1;r.profit=r.profit||0;r.done=r.done||0;if(r.ins==null)r.ins=false;return s;}
/* ---- markets ---- */
function reMkt(cid){const r=S.re;if(r.mkt[cid]==null){r.mkt[cid]=rnd(.92,1.08);r.tr[cid]=gauss()*.002;r.hist[cid]=[r.mkt[cid]];}return r.mkt[cid];}
const reCityMul=cid=>Math.pow((C(cid).live||50)/55,1.5);
const reYieldMul=cid=>clamp(Math.sqrt(55/(C(cid).live||50)),.85,1.25);
const reYearCh=cid=>{reMkt(cid);const h=S.re.hist[cid];const a=h[Math.max(0,h.length-1-TPY)];return h[h.length-1]/a-1;};
function reMood(cid){reMkt(cid);const t=S.re.tr[cid];return t>.007?['Hot','b-mine']:t>.002?['Rising','b-mine']:t>-.002?['Steady','b-info']:t>-.007?['Cooling','b-free']:['Falling','b-rival'];}
function reMarketsTurn(scenes){const r=S.re;const ids=new Set([S.loc,...r.props.map(p=>p.city),...CITIES.map(c=>c.id)]);
 ids.forEach(cid=>{if(!C(cid))return;let m=reMkt(cid),t=r.tr[cid];t=t*.92+gauss()*.0032-Math.log(m)*.004;r.tr[cid]=clamp(t,-.05,.05);m*=Math.exp(r.tr[cid]+gauss()*.006+.0015);r.mkt[cid]=clamp(m,.4,3);const h=r.hist[cid];h.push(r.mkt[cid]);if(h.length>40)h.shift();});
 const mine=[...new Set(r.props.map(p=>p.city))];
 // rare country-wide crash
 if(Math.random()<.006){const ccs=[...new Set(CITIES.map(c=>c.c))];const cc=mine.length&&Math.random()<.6?C(pick(mine)).c:pick(ccs);CITIES.filter(c=>c.c===cc).forEach(c=>{reMkt(c.id);r.tr[c.id]-=.028;});
  scenes.push({who:'anchor',mood:'worried',tag:['t-bad','Housing crash'],pages:[`Breaking: home prices in ${CNAME(cc)} are starting to fall hard. Banks are tightening up and buyers are disappearing.`,`Experts expect prices there to drop 20 to 30% over the next couple of years before they recover.${r.props.some(p=>C(p.city).c===cc)?' You own property there. Selling now locks in today\'s price. Holding means riding it out.':' If you have cash, bargains could show up there soon.'}`]});}
 // a city boom
 else if(Math.random()<.04){const pool=CITIES.filter(c=>c.id!==S.loc);const c=mine.length&&Math.random()<.5?C(pick(mine)):pick(pool);reMkt(c.id);r.tr[c.id]+=.014;const why=pick(['A big tech company just picked it for its new headquarters','A new subway line was approved','A university is opening a new campus there','A huge factory is being built nearby, bringing thousands of jobs']);
  scenes.push({who:'anchor',mood:'happy',tag:['t-good','Property boom'],pages:[`${why}, so everyone wants to live in ${c.name}.`,`Home prices in ${c.name} should climb fast for a while.${r.props.some(p=>p.city===c.id)?' Good news: you already own property there.':' Buy there early and you ride the wave.'}`]});}}
/* ---- values ---- */
const reFair=(type,cid,cond)=>RT(type).base*reCityMul(cid)*reMkt(cid)*(S.cpi||1)*(.5+.5*cond/100);
const reVal=p=>reFair(p.type,p.city,p.cond)*(p.mul||1);
const reRent=p=>{const t=RT(p.type);return t.base*reCityMul(p.city)*Math.sqrt(reMkt(p.city))*(S.cpi||1)*t.yld*reYieldMul(p.city)/TPY*(.7+.3*p.cond/100)*(p.prem?1.15:1);};
const reUpkeep=p=>reVal(p)*.011/TPY;
const reInsCost=p=>reVal(p)*.0035/TPY;
const reMgrCost=p=>reRent(p)*.08;
const reNet=p=>(p.rent&&!p.reno?reRent(p)-(p.mgr?reMgrCost(p):0):0)-reUpkeep(p)-(S.re.ins?reInsCost(p):0)-(p.mort?p.mort.pmt:0);
const reMortBal=()=>S.re.props.reduce((a,p)=>a+(p.mort?p.mort.bal:0),0);
const reValue=()=>S.re.props.reduce((a,p)=>a+reVal(p),0);
const reEquity=()=>S.re?reValue()-reMortBal():0;
const reUnmanaged=()=>S.re?S.re.props.filter(p=>!p.mgr).length:0;
const reRate=low=>clamp(.045+((S.infl||.025)-.025)*.8+(low?.005:0),.02,.12);
const rePmt=(L,rate)=>{const i=rate/TPY,n=25*TPY;return L*i/(1-Math.pow(1+i,-n));};

const reRenoCost=p=>Math.round(RT(p.type).base*reCityMul(p.city)*(S.cpi||1)*.2*(100-p.cond)/100);

const reUnlocked=i=>i<=S.re.maxTier+2;
const reCanHere=(t,cid)=>!t.big||(C(cid).live||0)>=t.big;
/* ---- listings ---- */
function reNewListing(cid){const ok=RE_TYPES.map((t,i)=>({t,i})).filter(o=>reUnlocked(o.i)&&reCanHere(o.t,cid));const top=Math.max(...ok.map(o=>o.i));
 const have=(S.re.list[cid]?S.re.list[cid].items:[]).map(l=>l.type);const w=ok.map(o=>have.filter(x=>x===o.t.id).length>=2?0:o.t.id==='fixer'?1.4:o.i>=top-1?1.6:1);let x=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(x>w[k]){x-=w[k];k++;}const t=ok[Math.min(k,ok.length-1)].t;
 const cond=t.id==='fixer'?Math.round(rnd(10,35)):Math.random()<.22?Math.round(rnd(25,55)):Math.round(rnd(60,96));
 const nm=RTI(t.id)<=4||t.id==='mansion'?`${Math.floor(rnd(2,240))} ${pick(STREETS)} ${pick(['St','Ave','Rd','Lane','Drive'])}`:`The ${pick(BLDG)} ${t.id==='plaza'?'Plaza':t.id==='office'?'Centre':t.id==='walkup'?'Apartments':'Tower'}`;
 return {id:'ls'+(S.re.seq++),type:t.id,cond,deal:+rnd(.85,1.07).toFixed(3),name:nm};}
function reListings(cid){const r=S.re;let L=r.list[cid];if(!L){L=r.list[cid]={t:S.trips,items:[]};}
 if(L.t!==S.trips){L.items=L.items.filter(()=>Math.random()<.55);L.t=S.trips;}
 // always offer the newest unlocked tier if the city allows it
 while(L.items.length<5)L.items.push(reNewListing(cid));
 const best=RE_TYPES.map((t,i)=>i).filter(i=>reUnlocked(i)&&reCanHere(RE_TYPES[i],cid)).pop();if(!L.items.some(l=>RTI(l.type)===best)){const n=reNewListing(cid);n.type=RE_TYPES[best].id;if(n.cond<30)n.cond=70;L.items[L.items.length-1]=n;}
 return L.items;}
const reListPrice=(l,cid)=>Math.round(reFair(l.type,cid,l.cond)*l.deal);
/* ---- buying and selling ---- */
function reBuy(lid,down){const cid=S.loc,L=reListings(cid),l=L.find(x=>x.id===lid);if(!l)return toast('That listing is gone.');
 const price=reListPrice(l,cid),close=Math.round(price*.02),cashNeed=Math.round(price*down)+close,loan=price-Math.round(price*down);
 if(S.cash<cashNeed)return toast('Not enough cash.');if(loan>0&&reMortBal()+loan>reMortCap())return toast('The bank won\'t lend you that much yet. Grow your net worth or pay down other mortgages.');
 S.cash-=cashNeed;const rate=reRate(down<.3);const p={id:'pr'+(S.re.seq++),type:l.type,city:cid,cond:l.cond,name:l.name,cost:price+close,rent:false,mgr:false,reno:null,vac:0,bad:0,mul:1,t:turnsIn()};
 if(loan>0)p.mort={bal:loan,rate,pmt:rePmt(loan,rate),missed:0};
 const was=S.re.maxTier;S.re.props.push(p);S.re.list[cid].items=L.filter(x=>x!==l);S.re.maxTier=Math.max(S.re.maxTier,RTI(l.type));
 addLog(S,`Bought ${p.name} in ${C(cid).name} (${RT(p.type).name}) for ${money(price)}${loan?`, ${money(loan)} on a mortgage`:''}.`,'');popCash(`-${money(cashNeed)}`,'var(--loss)');sfx('buy');
 const nu=RE_TYPES.filter((t,i)=>i>was+2&&reUnlocked(i));toast(nu.length?`Yours! You can now buy: ${nu.map(t=>t.name.toLowerCase()).join(', ')}.`:'Yours! Find it under My properties.');after();}
const reSaleNet=p=>Math.round(reVal(p)*.95);
function reSell(id,price,why){const p=S.re.props.find(x=>x.id===id);if(!p)return;const gross=price!=null?price:reSaleNet(p);const bal=p.mort?p.mort.bal:0;let net=gross-bal;
 if(net>=0)S.cash+=net;else payOut(-net);const prof=gross-p.cost;S.re.profit+=prof;S.re.done++;S.re.props=S.re.props.filter(x=>x!==p);
 addLog(S,`${why||'Sold'} ${p.name} in ${C(p.city).name} for ${money(gross)}${bal?` (paid off ${money(bal)} mortgage)`:''}. ${prof>=0?'Profit':'Loss'}: ${money(Math.abs(prof))}.`,prof>=0?'good':'bad');
 if(net>0)popCash(`+${money(net)}`,'var(--cash)');return {gross,net,prof};}
/* ---- every turn ---- */
function reTurn(scenes){if(!S.re)return;reMarketsTurn(scenes);let inc=0,cost=0,mort=0;const gone=[];
 S.re.props.forEach(p=>{const t=RT(p.type);
  if(p.reno){p.reno.left--;if(p.reno.left<=0){p.cond=p.reno.to;if(p.reno.prem){p.prem=true;p.mul=(p.mul||1)*1.12;}p.reno=null;addLog(S,`Renovation finished on ${p.name}.`,'good');
    scenes.push({who:'bo',mood:'happy',tag:['t-good','Renovation done'],pages:[`${p.name} in ${C(p.city).name} is finished. Condition is now ${Math.round(p.cond)} out of 100.`,`It's worth about ${money(reVal(p))} now. ${p.rent?'Tenants can move back in.':'Rent it out or sell it, your call.'}`]});}
   else if(!p.reno.hit&&Math.random()<.22){p.reno.hit=true;const extra=Math.round(p.reno.cost*rnd(.25,.5)),pid=p.id;
    scenes.push({who:'bo',mood:'worried',tag:['t-choice','Renovation'],pages:[`Bad news on ${p.name}. We opened up the walls and found ${pick(['mold','rotten beams','old wiring that has to go','a cracked foundation','asbestos'])}.`,`It's another ${money(extra)} to do it right. Or I patch it up and we finish with the condition at 75 instead of 100.`],choices:[

     {label:'Patch it, finish at 75',run:()=>{const q=S.re.props.find(x=>x.id===pid);if(!q||!q.reno)return;q.reno.to=Math.min(q.reno.to,75);return ok('bo','Fine. It won\'t be perfect, but it\'ll do.','worried');}}]});}}
  else{
   // disasters
   if(Math.random()<.002){const what=pick(['A fire broke out','A pipe burst and flooded','A storm tore the roof off']);if(S.re.ins){const ded=Math.round(reVal(p)*.01);cost+=ded;p.cond=Math.max(5,p.cond-10);
     scenes.push({who:'kim',mood:'worried',tag:['t-bad','Property damage'],pages:[`${what} at ${p.name} in ${C(p.city).name}.`,`Good thing you have insurance. It covered almost everything. You paid the ${money(ded)} deductible.`]});}
    else{const was=reVal(p);p.cond=Math.max(5,p.cond-rnd(40,60));if(p.rent)p.vac=2;
     scenes.push({who:'kim',mood:'worried',tag:['t-bad','Property damage'],pages:[`${what} at ${p.name} in ${C(p.city).name}.`,`You had no insurance, so it's all on you. The place lost about ${money(was-reVal(p))} in value. Renovate it to bring it back. Insurance is in the Real estate tab.`]});}}
   if(p.rent){if(p.vac>0){p.vac--;}else if(p.bad>0){p.bad--;p.cond=Math.max(5,p.cond-1);}
    else{inc+=reRent(p);if(p.mgr)cost+=reMgrCost(p);
     if(Math.random()<(p.mgr?.02:.05))p.vac=Math.ceil(rnd(0,3));
     else if(Math.random()<(p.mgr?.008:.025)){p.bad=Math.ceil(rnd(1,4));const pid=p.id,fee=Math.round(reRent(p)*1.5);
      scenes.push({who:'priya',mood:'worried',tag:['t-choice','Tenant trouble'],pages:[`${t.big?'A big tenant':'Your tenant'} at ${p.name} stopped paying rent and won't answer calls.`,`I can start an eviction for ${money(fee)} in legal fees and have them out by next turn. Or you can wait and hope they catch up. ${p.mgr?'':'A property manager would have screened them better.'}`],choices:[
       {label:`Evict them (${money(fee)})`,go:true,run:()=>{const q=S.re.props.find(x=>x.id===pid);if(!q)return;payOut(fee);q.bad=0;q.vac=1;addLog(S,`Evicted a tenant at ${q.name} (${money(fee)}).`,'bad');return ok('priya','Done. They\'re out. I\'ll find someone new.');}},
       {label:'Wait it out',run:()=>ok('priya','Your call. Fingers crossed.','worried')}]});}}
    p.cond=Math.max(5,p.cond-(p.mgr?.35:.6));}
   else p.cond=Math.max(5,p.cond-.2);
   if(p.mgr&&!p.rent)cost+=0;}
  cost+=reUpkeep(p)+(S.re.ins?reInsCost(p):0);
  });
 S.cash+=inc;payOut(cost);
 S.re.props.filter(p=>p.mort).forEach(p=>{const m=p.mort,i=m.rate/TPY,int=m.bal*i,pr=Math.min(m.bal,m.pmt-int);
   if(S.cash+S.savings>=m.pmt){payOut(m.pmt);mort+=m.pmt;m.bal=Math.max(0,m.bal-pr);m.missed=0;if(m.bal<1){delete p.mort;addLog(S,`Mortgage on ${p.name} is fully paid off!`,'good');}}

 gone.forEach(p=>{const r=reSell(p.id,Math.round(reVal(p)*.75),'Bank foreclosed on');scenes.push({who:'okonkwo',mood:'worried',tag:['t-bad','Foreclosure'],pages:[`You missed 3 mortgage payments, so the bank took ${p.name} and sold it at a discount.`,`It went for ${money(r.gross)}, well under its value. ${r.net>=0?`After paying off the mortgage you got ${money(r.net)} back.`:`That didn't even cover the mortgage, so the ${money(-r.net)} left over was added to your bank loan.`}`]});});
 S.re.last={inc,cost,mort};if(S.re.props.length&&(inc||cost||mort))addLog(S,`Real estate: rent +${money(inc)}, upkeep and fees -${money(cost)}${mort?`, mortgages -${money(mort)}`:''}.`,inc-cost-mort>=0?'good':'bad');
 // a buyer wants one of yours
 const own=S.re.props.filter(p=>!p.reno);if(own.length&&Math.random()<.035){const p=pick(own),off=Math.round(reVal(p)*rnd(1.08,1.25)),pid=p.id,bal=p.mort?p.mort.bal:0;
  scenes.push({who:'priya',mood:'happy',tag:['t-choice','Offer on your property'],pages:[`A buyer fell in love with ${p.name} in ${C(p.city).name}. They're offering ${money(off)}, no agent fees.`,`It's worth about ${money(reVal(p))} on the market and you've put ${money(p.cost)} into it.${bal?` Your ${money(bal)} mortgage would be paid off from the sale.`:''}`],choices:[

 // rezoning chance on commercial and apartment buildings

function rollEvents(ctx){
 if(S.trips<=1)return [];
 const n=Math.random()<.15?0:(Math.random()<.4?2:1),out=[],usedIds=new Set();
 for(let i=0;i<n;i++){let tone;const r=Math.random(),bad=dif().bad*.45*tr().luck;
  if(r<bad)tone='bad';else if(r<bad+.42)tone='choice';else if(r<bad+.68)tone='market';else tone='good';
  const okE=e=>e.tone===tone&&!usedIds.has(e.id)&&(!e.cond||e.cond(ctx)),fresh=e=>!S.seen||!S.seen[e.id]||S.trips-S.seen[e.id]>=6;
  let pool=EVENTS.filter(e=>okE(e)&&fresh(e));if(!pool.length)pool=EVENTS.filter(okE);if(!pool.length)continue;
  const tot=pool.reduce((a,e)=>a+(e.w||1),0);let x=Math.random()*tot,ev=pool[0];for(const e of pool){x-=(e.w||1);if(x<=0){ev=e;break;}}
  usedIds.add(ev.id);(S.seen=S.seen||{})[ev.id]=S.trips;const res=ev.run(ctx);if(res){if(!res.market)res.tag=res.tag||TONE_TAG[tone];out.push(res);}}
 return out;
}

let SC=null,typer=null;
const resolveWho=w=>!w?null:typeof w==='string'?NPC[w]:w;
const pagesOf=sc=>sc.pages.map(p=>typeof p==='string'?{text:p}:p);
function playScenes(list,done){if(!list.length){done&&done();return;}closeModal();SC={list,i:0,p:0,done,bg:null};$('#stage').hidden=false;document.body.classList.add('noscroll');showScene(true);}
function sceneSound(sc){const tg=sc.tag&&sc.tag[0],lb=sc.tag&&sc.tag[1];
 if(sc.bg==='trip'&&sc.bgArgs&&sc.bgArgs[0]!==sc.bgArgs[1]){const m=sc.bgArgs[2];sfx(m==='plane'?'plane':m==='truck'||m==='van'?'truck':m==='ferry'||m==='boat'?'boat':'bus');return;}
 if(lb==='You won the bet')return sfx('win');if(lb==='New rank')return sfx('rank');
 if(tg==='t-good')sfx('good');else if(tg==='t-bad')sfx('bad');else if(tg==='t-choice')sfx('choice');}
function showScene(changed){
 const sc=SC.list[SC.i],pg=pagesOf(sc)[SC.p],who=resolveWho(sc.who);if(changed&&SC.p===0)sceneSound(sc);
 const bgKey=sc.bg||(who&&who.bg)||'city',bgEl=$('#stageBg');
 if(changed){const args=sc.bgArgs||(bgKey==='city'?[S.loc]:[]);const k=bgKey+args.join();if(k!==SC.bg||bgKey==='trip'){bgEl.className='stage-bg'+(bgKey==='trip'?' trip':'');bgEl.innerHTML=BG[bgKey](...args);void bgEl.offsetWidth;bgEl.classList.add('fadein');SC.bg=k;}}

 if(who){if(changed||pg.mood){actor.hidden=false;actor.innerHTML=figure(who.look,{mood:pg.mood||sc.mood||'happy'});if(changed){actor.classList.remove('enter');void actor.offsetWidth;actor.classList.add('enter');}}}
 else actor.hidden=true;
 const b=$('#bubble');if(changed){b.classList.remove('enter');void b.offsetWidth;b.classList.add('enter');}
 $('#bwho').innerHTML=(who?`<b>${esc(who.name)}</b><span>${esc(who.role||'')}</span>`:`<div class="weektitle">${sc.tag?esc(sc.tag[1]):''}</div>`)+(sc.tag&&who?` <span class="evtag ${sc.tag[0]}">${esc(sc.tag[1])}</span>`:'');
 $('#bextra').innerHTML='';$('#bchoices').innerHTML='';$('#tapnext').hidden=true;
 $('#sdots').innerHTML=SC.list.map((_,i)=>`<i class="${i<=SC.i?'on':''}"></i>`).join('');
 if(changed&&sc.onShow)sc.onShow();
 const pgs=pagesOf(sc),lastP=SC.p===pgs.length-1,full=lastP&&sc.choices&&pgs.length>1?pgs.map(x=>x.text).join('\n\n'):pg.text;
 typeText(full,()=>{$('#bextra').innerHTML=pg.extra||'';const last=SC.p===pagesOf(sc).length-1;
  if(last&&sc.choices)$('#bchoices').innerHTML=sc.choices.map((c,i)=>`<button class="btn ${c.go?'go':''}" data-sc="${i}">${esc(c.label)}</button>`).join('');else $('#tapnext').hidden=false;});
}
function typeText(text,cb){clearInterval(typer);const el=$('#btext');SC.full=text;SC.cb=cb;SC.typing=true;
 if(reduced){el.textContent=text;return finishType();}let i=0;el.textContent='';$('#actor').classList.add('talking');
 typer=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length)finishType();},20);}
function finishType(){clearInterval(typer);if(!SC)return;$('#btext').textContent=SC.full;$('#actor').classList.remove('talking');SC.typing=false;const cb=SC.cb;SC.cb=null;cb&&cb();}
function advance(){if(!SC)return;if(SC.typing)return finishType();const sc=SC.list[SC.i],n=pagesOf(sc).length;if(SC.p===n-1&&sc.choices)return;if(SC.p<n-1){SC.p++;showScene(false);return;}nextScene();}
function nextScene(){SC.i++;SC.p=0;if(SC.i>=SC.list.length)return endScenes();showScene(true);}
function endScenes(){clearInterval(typer);const done=SC&&SC.done;SC=null;$('#stage').hidden=true;document.body.classList.remove('noscroll');renderGame();done&&done();}
function skipScenes(){if(!SC)return;if(SC.typing)finishType();
 for(let i=SC.i;i<SC.list.length;i++){const s=SC.list[i];if(s.choices){if(i===SC.i&&SC.p===pagesOf(s).length-1)return;SC.i=i;SC.p=pagesOf(s).length-1;return showScene(true);}}endScenes();}
function chooseScene(k){const sc=SC.list[SC.i],res=sc.choices[k].run();
 if(res==='stop'){clearInterval(typer);SC=null;$('#stage').hidden=true;document.body.classList.remove('noscroll');return;}
 sc.choices=null;save();renderGame();if(res){res.tag=res.tag||sc.tag;SC.list.splice(SC.i+1,0,res);}nextScene();}
$('#stage').addEventListener('click',e=>{if(e.target.closest('button'))return;advance();});
$('#skipBtn').addEventListener('click',e=>{e.stopPropagation();skipScenes();});
$('#bchoices').addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(b)chooseScene(+b.dataset.sc);});
document.addEventListener('keydown',e=>{if(SC&&(e.key===' '||e.key==='Enter')&&!e.target.closest('button')){e.preventDefault();advance();}});

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2400);}
function popCash(text,color){if(reduced)return;const el=$('#cashVal');if(!el)return;const r=el.getBoundingClientRect();const p=document.createElement('div');p.className='pop';p.textContent=text;p.style.color=color;p.style.left=(r.left+r.width/2)+'px';p.style.top=r.bottom+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1100);}
function confetti(){if(reduced)return;const cols=['#12B076','#FFB21F','#3D7BFF','#F0574A','#8D63F2'];for(let i=0;i<60;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.5+'s';c.style.animationDuration=(1.4+Math.random())+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600);}}
let shownCash=null;
function tweenCash(to){const el=$('#cashVal');if(!el)return;if(shownCash===null||reduced){shownCash=to;el.textContent=money(to);return;}const from=shownCash;shownCash=to;if(from===to){el.textContent=money(to);return;}const t0=performance.now();
 (function step(t){const k=Math.min(1,(t-t0)/500),e=1-Math.pow(1-k,3);el.textContent=money(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(t0);}

const yld0=id=>coDef(id)[4];
function openBank(kind){const lim=creditLimit(),max={dep:S.cash,wd:S.savings,borrow:canBorrow(),repay:Math.min(S.cash,S.debt)}[kind];
 const title={dep:'Deposit to savings',wd:'Withdraw savings',borrow:'Borrow money',repay:'Repay your loan'}[kind];
 AM={kind:'bank',op:kind,n:Math.floor(max),min:0,max:Math.floor(max)};
 openModal(`<span class="evtag t-good">Beacon Savings &amp; Loan</span><h2>${title}</h2>
  <div class="qty"><div class="qn" id="amN" style="font-size:40px">${money(AM.n)}</div></div><input type="range" class="range" id="amR" min="0" max="${AM.max}" step="${Math.max(1,Math.round(AM.max/200))}" value="${AM.max}" aria-label="Amount">
  <div class="swatches" style="justify-content:center">${[.25,.5,1].map(f=>`<button class="chip" data-amset="${Math.floor(AM.max*f)}">${f===1?'All':Math.round(f*100)+'%'}</button>`).join('')}</div>
  <div class="recap" id="amRecap"></div><div class="ev-btns"><button class="btn go big" data-amgo="1" id="amGo">Confirm</button><button class="btn" data-close>Cancel</button></div>`);
 bindAmount();}
let SK=null;
function openStock(sym,mode){const st=ST(sym),[,name,sec,,vol,,div]=SD(sym),h=S.shares[sym],sh=S.shorts[sym],f=commission();
 mode=mode||(h?'sell':'buy');if((mode==='short'||mode==='cover')&&!canShort())mode='buy';
 const max={buy:Math.floor(S.cash/(st.p*(1+f))),sell:h?h.n:0,short:Math.floor(shortRoom()/st.p),cover:sh?Math.min(sh.n,Math.floor(S.cash/(st.p*(1+f)))):0}[mode];
 SK={sym,mode,max,n:Math.min(max,mode==='sell'||mode==='cover'?max:Math.max(1,Math.floor(max/4)))};
 const ch=(st.p/st.last-1)*100,hi=Math.max(...st.hist),lo=Math.min(...st.hist),col=ch>=0?'#12B076':'#F0574A';
 const modes=[['buy','Buy'],['sell','Sell']].concat(canShort()?[['short','Short'],['cover','Cover']]:[]);
 openModal(`<span class="evtag t-info">${sec} · ${sym}</span><h2>${esc(name)}</h2>
  <div class="between"><b style="font-family:var(--display);font-size:34px;font-weight:400">${pr(st.p)}</b><b class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(1)}% this week</b></div>
  <div style="margin:8px 0 4px">${spark(st.hist,420,110,col).replace('width="420" height="110"','width="100%" height="110" preserveAspectRatio="none"')}</div>
  <div class="between label" style="margin-bottom:8px"><span>${st.hist.length} weeks ago</span><span>Now</span></div>
  <div class="recap"><div><span>Range shown</span><b>${pr(lo)} to ${pr(hi)}</b></div><div><span>Dividend</span><b>${div?`${(div*52*100).toFixed(1)}% a year, paid weekly`:'None'}</b></div><div><span>Risk</span><b>${vol>.07?'High':vol>.045?'Medium':'Low'}</b></div>
   ${h?`<div><span>You own</span><b>${h.n.toLocaleString()} shares · ${money(h.n*st.p)} <small class="${st.p>=h.avg?'up':'down'}">(${st.p>=h.avg?'+':''}${money(h.n*(st.p-h.avg))})</small></b></div>`:''}
   ${sh?`<div><span>Shorted</span><b>${sh.n.toLocaleString()} at ${pr(sh.entry)} <small class="${st.p<=sh.entry?'up':'down'}">(${st.p<=sh.entry?'+':''}${money(sh.n*(sh.entry-st.p))})</small></b></div>`:''}</div>
  <div class="seg">${modes.map(([k,n])=>`<button class="chip ${mode===k?'on':''}" data-skmode="${k}" style="flex:1">${n}</button>`).join('')}</div>
  ${mode==='short'?'<p class="muted" style="font-size:13px;margin:10px 0 0">Shorting means you borrow shares and sell them now, hoping to buy them back cheaper later. If the price rises instead, your losses keep growing.</p>':''}
  ${max>0?`<div class="qty"><button class="qbtn" data-skq="-1" aria-label="Fewer">−</button><div class="qn" id="skN" style="font-size:40px">${SK.n.toLocaleString()}</div><button class="qbtn" data-skq="1" aria-label="More">+</button></div>
  <input type="range" class="range" id="skR" min="1" max="${max}" value="${SK.n}" aria-label="Shares">
  <div class="swatches" style="justify-content:center">${[.25,.5,1].map(x=>`<button class="chip" data-skset="${Math.max(1,Math.floor(max*x))}">${x===1?'Max':Math.round(x*100)+'%'}</button>`).join('')}</div>
  <div class="recap" id="skRecap"></div><div class="ev-btns"><button class="btn go big" id="skGo" data-skgo="1"></button><button class="btn" data-close>Close</button></div>`
  :`<p style="margin-top:12px">${{buy:'You don\'t have enough cash to buy a share.',sell:'You don\'t own any shares of this stock.',short:'You can\'t short more right now. Your short positions are capped at 30% of your net worth.',cover:'You have no short position here, or not enough cash to buy the shares back.'}[mode]}</p><div class="ev-btns"><button class="btn" data-close>Close</button></div>`}`);
 const rr=$('#skR');if(rr)rr.oninput=e=>{SK.n=+e.target.value;skNums();};skNums();}
function skNums(){if(!SK||!$('#skN'))return;const st=ST(SK.sym),f=commission(),n=SK.n,v=n*st.p;$('#skN').textContent=n.toLocaleString();$('#skR').value=n;
 const cashAfter={buy:S.cash-v*(1+f),sell:S.cash+v*(1-f),short:S.cash+v*(1-f),cover:S.cash-v*(1+f)}[SK.mode];
 $('#skRecap').innerHTML=`<div><span>${{buy:'Total cost',sell:'You get',short:'You get now',cover:'Cost to buy back'}[SK.mode]}</span><b>${money(SK.mode==='buy'||SK.mode==='cover'?v*(1+f):v*(1-f))}</b></div><div><span>Cash after</span><b>${money(cashAfter)}</b></div>`;
 $('#skGo').textContent=`${{buy:'Buy',sell:'Sell',short:'Short',cover:'Cover'}[SK.mode]} ${n.toLocaleString()} share${n>1?'s':''}`;}
function bindAmount(){const r=$('#amR');if(r)r.oninput=e=>{AM.n=+e.target.value;amNums();};amNums();}
function amNums(){if(!AM||!$('#amN'))return;$('#amN').textContent=money(AM.n);$('#amR').value=AM.n;let rows='';
 if(AM.kind==='invest'){const st=S.startups.find(x=>x.id===AM.id),pct=AM.n/(st.val+AM.n);rows=`<div><span>You get</span><b>${(pct*100).toFixed(2)}% of ${esc(st.name)}</b></div><div><span>Cash after</span><b>${money(S.cash-AM.n)}</b></div>`;$('#amGo').textContent=`Invest ${money(AM.n)}`;}
 else{const o=AM.op;rows=`<div><span>Cash after</span><b>${money(S.cash+(o==='dep'||o==='repay'?-AM.n:AM.n))}</b></div>${o==='dep'||o==='wd'?`<div><span>Savings after</span><b>${money(S.savings+(o==='dep'?AM.n:-AM.n))}</b></div>`:`<div><span>Loan after</span><b>${money(S.debt+(o==='borrow'?AM.n:-AM.n))}</b></div>`}`;$('#amGo').disabled=!AM.n;}
 $('#amRecap').innerHTML=rows;}
function showMenu(){openModal(`<span class="evtag t-week">Menu</span><h2>${esc(S.name)}</h2><p>${TRAITS[S.trait].name} · ${DIFF[S.diff].label} · Week ${S.week}</p>${syncLine()}
 <div class="card" style="display:grid;gap:10px;margin:6px 0 4px;box-shadow:none;background:var(--surface2)"><div class="between"><b>Go back in time</b><span class="label">${HIST.length} turn${HIST.length===1?'':'s'} saved</span></div>
  <p class="muted" style="margin:0;font-size:13px">Made a bad call? Undo the last few turns. The game keeps your last 10.</p>
  <div class="btnrow" style="grid-template-columns:repeat(3,1fr);display:grid">${[1,2,10].map(n=>`<button class="btn" style="background:var(--surface);box-shadow:var(--shadow)" data-rewind="${n}" ${HIST.length<n?'disabled':''}>${n} turn${n>1?'s':''}</button>`).join('')}</div>${S.rewinds?`<span class="label">Times you've gone back: ${S.rewinds}</span>`:''}</div>
 <div class="ev-btns"><button class="btn go" data-close>Back to the game</button><button class="btn" data-act="sound">${sndOn?'Sound: on':'Sound: off'}</button>${ACC_ON&&AUTH?'<button class="btn" data-act="account">Account</button>':''}<button class="btn" data-act="replayIntro">Replay the tutorial</button><button class="btn" data-act="home">Title screen</button><button class="btn" data-act="askNew" style="color:var(--loss)">Start a new game</button></div>`);}
function askNew(){openModal(`<span class="evtag t-bad">Careful</span><h2>Start over?</h2><p>This deletes your current game for good.</p><div class="ev-btns"><button class="btn danger" data-act="confirmNew">Yes, start over</button><button class="btn" data-close>Keep playing</button></div>`);}

/* ===================== NAV / INPUT ===================== */
function show(id){['title','create','game'].forEach(s=>$('#scr-'+s).hidden=s!==id);window.scrollTo(0,0);}
function goTitle(){closeModal();titleLooks=Array.from({length:7},randLook);renderTitle();show('title');reconcile(true);}
function goCreate(){closeModal();cfg={name:'',look:{...randLook(),acc:[]},trait:'street',diff:'normal'};renderCreate();show('create');}
function startGame(s){S=s;if(S.effects&&!S.effects.some(e=>e.deal)){makeDeals();save();}shownCash=null;UI.tab='market';UI.lastTab=null;closeModal();show('game');renderGame();if(!S.intro){S.intro=true;save();playScenes(introScene());}}
document.addEventListener('click',e=>{
 {const bt=e.target.closest('button');if(bt&&!bt.disabled&&!bt.dataset.tconfirm)sfx('tap');}
 if(e.target.closest('#stage'))return;
 if(e.target===$('#modal')){closeModal();if(UI.sel){UI.sel=null;renderGame();}return;}
 const t=e.target.closest('button,[data-city],[data-mapv]');if(!t)return;const d=t.dataset;
 if(d.bz){bizClick(d,t);return;}
 if(d.ma){maClick(d);return;}
 if(d.lf){lifeClick(d);return;}
 if(d.hl){healthClick(d);return;}
 if(d.bd){bondClick(d);return;}
 if(d.re){reClick(d);return;}
 if(d.close!==undefined){closeModal();if(UI.sel){UI.sel=null;renderGame();}}
 else if(d.act==='new'){if(loadSave())openModal(`<span class="evtag t-bad">Careful</span><h2>Start a new game?</h2><p>You already have a game in progress. Starting over deletes it.</p><div class="ev-btns"><button class="btn danger" data-act="confirmNew">Start over</button><button class="btn go" data-act="continue">Continue my game</button></div>`);else goCreate();}
 else if(d.act==='continue'){const s=loadSave();if(s)startGame(s);else goCreate();}
 else if(d.act==='start'){if(!cfg.name)cfg.name='The Kid';resetHist();startGame(newGame(cfg));save();}
 else if(d.rewind){const n=+d.rewind,w=histWeek(n);openModal(`<span class="evtag t-choice">Go back in time</span><h2>Back to week ${w}?</h2><p>This undoes your last ${n===1?'turn':n+' turns'}. Every trade, trip and event since week ${w} is wiped, and you pick up from there.</p><div class="ev-btns"><button class="btn go big" data-rewindgo="${n}">Yes, go back</button><button class="btn" data-close>Keep playing</button></div>`);}
 else if(d.rewindgo){closeModal();rewind(+d.rewindgo);}
 else if(d.mapv){UI.mapv=d.mapv;UI.sel=null;renderGame();const a=document.querySelector('.mapchips .chip.on');if(a)a.scrollIntoView({inline:'center',block:'nearest'});}
 else if(d.act==='randLook'){cfg.look=randLook();renderCreate();}
 else if(d.look!==undefined){cfg.look[d.look]=+d.i;renderCreate();}
 else if(d.top){cfg.look.top=d.top;renderCreate();}
 else if(d.acc){const a=cfg.look.acc,i=a.indexOf(d.acc);if(i>=0)a.splice(i,1);else{if(a.length>=3)a.shift();a.push(d.acc);}renderCreate();}
 else if(d.trait){cfg.trait=d.trait;renderCreate();}
 else if(d.diff){cfg.diff=d.diff;renderCreate();}
 else if(d.tab){UI.tab=d.tab;UI.sel=null;renderGame();window.scrollTo({top:0});}
 else if(d.filter){UI.filter=d.filter;renderGame();}
 else if(d.sort){setSort(d.sort);renderGame();}
 else if(d.lifecat){UI.lifeCat=d.lifecat;renderGame();}
 else if(d.lifesort){UI.lifeSort=d.lifesort;renderGame();}
 else if(d.deals){UI.deals=d.deals;renderGame();}
 else if(d.prod)openTrade(d.prod,'buy',d.back);
 else if(d.sellitem)openTrade(d.sellitem,'sell');
 else if(d.tmode){TS.mode=d.tmode;TS.n=d.tmode==='sell'?(S.inv[TS.p]?.qty||0):Math.min(1,maxBuy(TS.p));renderTrade();}
 else if(d.tq){TS.n=clamp(TS.n+(+d.tq),0,tMax());tradeNums();}
 else if(d.tset){TS.n=clamp(+d.tset,0,tMax());tradeNums();}
 else if(d.tconfirm){const {p,mode,n,back}=TS;closeModal();if(n)mode==='buy'?buy(p,n):sell(p,n);if(back&&!SC)openDest(back);}
 else if(d.act==='work')work();
 else if(d.city)openDest(d.city);
 else if(d.go){closeModal();travel(d.go);}
 else if(d.act==='stay'){closeModal();travel(S.loc);}
 else if(d.ride)buyRide(d.ride);
 else if(d.stock)openStock(d.stock);
 else if(d.skmode)openStock(SK.sym,d.skmode);
 else if(d.skq){SK.n=clamp(SK.n+(+d.skq),1,SK.max);skNums();}
 else if(d.skset){SK.n=clamp(+d.skset,1,SK.max);skNums();}
 else if(d.skgo){const k=SK;closeModal();stockTrade(k.sym,k.mode,k.n);}
 else if(d.startup)openStartup(d.startup);
 else if(d.co)openCo(d.co);
 else if(d.life)openLife(d.life);
 else if(d.buylife){closeModal();buyLife(d.buylife);}
 else if(d.selllife){closeModal();sellLife(d.selllife);}
 else if(d.ipoask)openIPO(d.ipoask);
 else if(d.ipo){closeModal();goPublic(d.ipo,+d.f);}
 else if(d.sellmore){closeModal();sellMore(d.sellmore);}
 else if(d.buyback){closeModal();buyBack(d.buyback);}
 else if(d.buyco){closeModal();buyCo(d.buyco);}
 else if(d.sellco){closeModal();sellCo(d.sellco);}
 else if(d.sellstake){closeModal();sellStake(d.sellstake);}
 else if(d.bank)openBank(d.bank);
 else if(d.amset){AM.n=+d.amset;amNums();}
 else if(d.amgo){const a=AM;closeModal();if(a.kind==='invest')invest(a.id,a.n);else bankOp(a.op,a.n);}
 else if(d.act==='starter')playScenes([starterLoanScene()]);
 else if(d.act==='menu')showMenu();
 else if(d.act==='sound'){setSound(!sndOn);t.textContent=sndOn?'Sound: on':'Sound: off';}
 else if(['signin','signup','forgot','account','recoveryDone','signout','askDelete','keepCloud','keepLocal'].includes(d.act))accountAct(d.act,t);
 else if(d.act==='replayIntro')playScenes(introScene());
 else if(d.act==='home')goTitle();
 else if(d.act==='askNew')askNew();
 else if(d.act==='confirmNew'){clearSave();goCreate();}
});
document.addEventListener('keydown',e=>{const n=e.target.closest&&e.target.closest('g[data-city]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDest(n.dataset.city);}});

/* ===================== BOOT ===================== */
function start(data){if(data&&data.S&&data.S.v===2){startGame(data.S);return;}renderTitle();show('title');reconcile(true);}
window.claude?.hot?.snapshot?.(()=>({S:$('#scr-game').hidden?null:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
